# apptaztic.com: static site. Installed by deploy/install.sh as
# /etc/nginx/sites-available/apptaztic.com.conf; certbot then adds the HTTPS parts.
# Only matches the names below, so other sites on the server are not affected.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    root /var/www/apptaztic;
    index index.html;

    access_log /var/log/nginx/apptaztic.access.log;
    error_log /var/log/nginx/apptaztic.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
